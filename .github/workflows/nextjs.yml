# CI build check for the editor app (V3/editor).
#
# History: this repo previously used the sample "Deploy Next.js to GitHub
# Pages" workflow, which expected a Next.js app at the repository root and
# failed on every push since Jan 2026 (it couldn't find ./package.json).
# The app now lives in V3/editor and is a fully dynamic Next.js App Router
# app (cookies() in the root layout, server actions, API routes, Clerk),
# so it cannot be statically exported for GitHub Pages. Hosting is on
# Vercel; this workflow only verifies the app builds on every push.

name: CI — build editor

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["next.js-15,-cloudflasre-and-firebase"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-editor
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V3/editor
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: V3/editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The build imports server modules that throw at load time when
      # credentials are missing (liveblocks.ts, firebase-admin.ts). CI has
      # no real secrets, so inject structurally-valid placeholders — they
      # are only ever parsed, never used to make real calls during build.
      - name: Provide placeholder credentials for build
        run: |
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_build_placeholder" >> "$GITHUB_ENV"
          echo "LIVEBLOCKS_PRIVATE_KEY=sk_test_build_placeholder" >> "$GITHUB_ENV"
          node -e "
            const c = require('crypto'), fs = require('fs');
            const { privateKey } = c.generateKeyPairSync('rsa', { modulusLength: 2048 });
            const pem = privateKey.export({ type: 'pkcs8', format: 'pem' });
            const key = JSON.stringify({
              type: 'service_account',
              project_id: 'build-placeholder',
              private_key_id: '0',
              private_key: pem,
              client_email: 'build@build-placeholder.iam.gserviceaccount.com',
              client_id: '0',
              auth_uri: 'https://accounts.google.com/o/oauth2/auth',
              token_uri: 'https://oauth2.googleapis.com/token',
            });
            fs.appendFileSync(process.env.GITHUB_ENV,
              'FIREBASE_SERVICE_ACCOUNT_KEY<<KEYEOF\n' + key + '\nKEYEOF');
          "

      - name: Build with Next.js
        run: npm run build
